name: Deploy Partner Frontend

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: partner-frontend
  DEPLOY_DIR: /opt/partner-frontend

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p ${{ env.DEPLOY_DIR }}
            echo "✅ Deploy directory ready: ${{ env.DEPLOY_DIR }}"

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.yml,.env.production.example"
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy and cleanup on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            cd ${{ env.DEPLOY_DIR }}

            # ---- Create .env.production if it doesn't exist ----
            if [ ! -f .env.production ]; then
              echo "Creating .env.production from example..."
              cp .env.production.example .env.production
              sed -i 's|# DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}|' .env.production
            fi

            # ---- Ensure DOCKERHUB_USERNAME is set for compose ----
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=latest

            # ---- Pull the latest image from Docker Hub ----
            echo "Pulling latest image from Docker Hub..."
            docker compose pull

            # ---- Deploy with zero-downtime ----
            echo "Deploying partner-frontend..."
            docker compose up -d --remove-orphans

            # ---- Wait for health check ----
            echo "Waiting for health check..."
            RETRIES=10
            DELAY=5
            for i in $(seq 1 $RETRIES); do
              if wget --no-verbose --tries=1 --spider http://localhost:3501/api/health 2>/dev/null; then
                echo "✅ Health check passed!"
                break
              fi
              if [ $i -eq $RETRIES ]; then
                echo "❌ Health check failed after $RETRIES attempts"
                echo "Container logs:"
                docker compose logs --tail=50 partner-frontend
                exit 1
              fi
              echo "Attempt $i/$RETRIES failed, retrying in ${DELAY}s..."
              sleep $DELAY
            done

            # ---- Cleanup: Remove old/dangling Docker images ----
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h" || true
            docker system prune -f --filter "until=24h" || true

            echo "🚀 Deployment complete!"
            docker compose ps
